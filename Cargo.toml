[workspace]
members = [
    "crates/yard-domain",
    "crates/yard-herdr",
    "crates/yard-server",
    "crates/yard-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
repository = "https://github.com/arvmaan/yard"
publish = false

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4"
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
futures-util = "0.3"
fs2 = "0.4"
getrandom = "0.3"
include_dir = "0.7"
libc = "0.2"
mime_guess = "2"
percent-encoding = "2"
# Slack Web API client (the only outbound HTTPS). rustls with the ring
# provider and the compiled-in Mozilla roots; no native-tls/OpenSSL, no HTTP/2.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots"] }
rusqlite = { version = "0.38", features = ["bundled"] }
rustix = { version = "1", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
# Slack Socket Mode client (outbound WebSocket). TLS is set up by Yard with
# tokio-rustls (ring provider, compiled-in Mozilla roots), not by tungstenite.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }
webpki-roots = "1"
zeroize = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
