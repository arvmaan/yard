[workspace]
members = [
    "crates/yard-domain",
    "crates/yard-herdr",
    "crates/yard-server",
    "crates/yard-store",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
readme = "README.md"
repository = "https://github.com/arvmaan/yard"
publish = false

[workspace.dependencies]
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
chrono = "0.4"
chrono-tz = "0.10"
http-body-util = "0.1"
futures-util = "0.3"
fs2 = "0.4"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = "0.29"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
